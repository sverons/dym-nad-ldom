<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070b14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Телефон — Дым над льдом</title>
  </head>
  <body style="font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <div class="device-wrapper">
      <div class="iphone" id="iphone">

        <!-- LOCK SCREEN -->
        <div class="screen lock-screen active" id="lockScreen">
          <div class="lock-wallpaper"></div>
          <div class="lock-content" id="lockContent">
            <div class="lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1C8.676 1 6 3.676 6 7v2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V11a2 2 0 00-2-2h-1V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4z" />
              </svg>
            </div>
            <div class="lock-time" id="lockTime">12:00</div>
            <div class="lock-date" id="lockDate">суббота, 21 февраля</div>
            <p class="passcode-title">Введите код-пароль</p>
            <div class="passcode-dots" id="passcodeDots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="passcode-error" id="passcodeError">Неверный код</div>
            <div class="numpad" id="numpad">
              <button type="button" class="num-key" data-num="1"><span>1</span></button>
              <button type="button" class="num-key" data-num="2"><span>2</span><small>АБВГ</small></button>
              <button type="button" class="num-key" data-num="3"><span>3</span><small>ДЕЖЗ</small></button>
              <button type="button" class="num-key" data-num="4"><span>4</span><small>ИЙКЛ</small></button>
              <button type="button" class="num-key" data-num="5"><span>5</span><small>МНОП</small></button>
              <button type="button" class="num-key" data-num="6"><span>6</span><small>РСТУ</small></button>
              <button type="button" class="num-key" data-num="7"><span>7</span><small>ФХЦЧ</small></button>
              <button type="button" class="num-key" data-num="8"><span>8</span><small>ШЩЪЫ</small></button>
              <button type="button" class="num-key" data-num="9"><span>9</span><small>ЬЭЮЯ</small></button>
              <button type="button" class="num-key empty" tabindex="-1" aria-hidden="true"></button>
              <button type="button" class="num-key" data-num="0"><span>0</span></button>
              <button type="button" class="num-key delete" id="deleteKey">
                <svg viewBox="0 0 24 18" fill="currentColor" aria-hidden="true">
                  <path d="M8.5 1L1 9L8.5 17H23V1H8.5ZM12 7L14.5 4.5L16 6L13.5 8.5L16 11L14.5 12.5L12 10L9.5 12.5L8 11L10.5 8.5L8 6L9.5 4.5L12 7Z" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- HOME SCREEN -->
        <div class="screen home-screen" id="homeScreen">
          <div class="home-wallpaper"></div>
          <div class="app-grid" id="homeAppGrid"></div>
          <button type="button" class="story-reset-btn" id="storyResetBtn" aria-label="Сброс игры" title="Сброс игры">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 4v4h4" />
            </svg>
            <span>Сброс</span>
          </button>
          <div class="home-indicator"></div>
        </div>

        <!-- GIBDD APPS -->
        <div class="screen app-screen gibdd-screen" id="gibddApp"></div>
        <div class="screen app-screen gibdd-screen" id="gibddAdminApp"></div>

        <!-- ADMIN APP -->
        <div class="screen app-screen admin-screen" id="adminApp"></div>

        <!-- HINTS APP -->
        <div class="screen app-screen hints-screen" id="hintsApp"></div>

        <!-- SIMPLE APPS (rendered by app.js) -->
        <div class="screen app-screen notes-screen" id="notesApp"></div>
        <div class="screen app-screen photos-screen" id="photosApp"></div>
        <div class="screen app-screen calendar-screen" id="calendarApp"></div>
        <div class="screen app-screen maps-screen" id="mapsApp"></div>
        <div class="screen app-screen browser-screen" id="browserApp"></div>
        <div class="screen app-screen novogram-screen" id="novogramApp"></div>

        <!-- MESSAGES APP -->
        <div class="screen app-screen" id="messagesApp">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="home" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Сообщения</h1>
            <button type="button" class="header-action" aria-label="Новое сообщение">✎</button>
          </div>
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="#8e8e93" aria-hidden="true">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z" />
            </svg>
            <span>Поиск</span>
          </div>
          <div class="chat-list" id="chatList"></div>
          <div class="home-indicator"></div>
        </div>

        <!-- CHAT DETAIL -->
        <div class="screen app-screen" id="chatDetail">
          <div class="app-header chat-header">
            <button type="button" class="back-btn" data-back="messages" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
              <span class="back-count">12</span>
            </button>
            <div class="chat-contact-info">
              <div class="contact-avatar" id="chatAvatar">А</div>
              <span id="chatContactName">Алексей</span>
            </div>
            <button type="button" class="header-action call-small" aria-label="Позвонить">
              <svg viewBox="0 0 24 24" fill="#007aff">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
              </svg>
            </button>
          </div>
          <div class="messages-container" id="messagesContainer"></div>
          <div class="message-input-bar">
            <button type="button" class="input-plus" aria-label="Вложение">+</button>
            <input type="text" placeholder="iMessage" id="messageInput" autocomplete="off" />
            <button type="button" class="send-btn" id="sendBtn" aria-label="Отправить">
              <svg viewBox="0 0 24 24" fill="#007aff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" /></svg>
            </button>
          </div>
          <div class="home-indicator"></div>
        </div>

        <!-- CALLS APP -->
        <div class="screen app-screen" id="callsApp">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="home" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Недавние</h1>
          </div>
          <div class="calls-tabs">
            <button type="button" class="tab active" data-tab="recent">Недавние</button>
            <button type="button" class="tab" data-tab="keypad">Клавиши</button>
          </div>
          <div class="tab-content active" id="recentTab">
            <div class="call-list" id="callList"></div>
          </div>
          <div class="tab-content" id="keypadTab">
            <div class="dialer-display" id="dialerDisplay"></div>
            <div class="dialer-pad" id="dialerPad"></div>
            <button type="button" class="call-btn" id="callBtn" aria-label="Позвонить">
              <svg viewBox="0 0 24 24" fill="white">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
              </svg>
            </button>
          </div>
          <div class="home-indicator"></div>
        </div>

        <!-- MAIL APP -->
        <div class="screen app-screen" id="mailApp">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="home" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Входящие</h1>
            <button type="button" class="header-action" aria-label="Написать">✎</button>
          </div>
          <div class="mail-list" id="mailList"></div>
          <div class="home-indicator"></div>
        </div>

        <!-- MAIL DETAIL -->
        <div class="screen app-screen" id="mailDetail">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="mail" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Письмо</h1>
          </div>
          <div class="mail-detail" id="mailDetailContent"></div>
          <div class="home-indicator"></div>
        </div>

        <!-- WEB APP (external sites) -->
        <div class="screen app-screen web-app-screen" id="webApp">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="home" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1 id="webAppTitle">Сайт</h1>
          </div>
          <iframe id="webAppFrame" class="web-app-frame" title="Веб-приложение"></iframe>
          <div class="home-indicator"></div>
        </div>

        <!-- GAMES APP -->
        <div class="screen app-screen" id="gamesApp">
          <div class="app-header">
            <button type="button" class="back-btn" data-back="home" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Игры</h1>
          </div>
          <div class="games-grid" id="gamesGrid"></div>
          <div class="home-indicator"></div>
        </div>

        <!-- SNAKE GAME -->
        <div class="screen app-screen" id="snakeGame">
          <div class="app-header dark">
            <button type="button" class="back-btn" data-back="games" aria-label="Назад">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
            </button>
            <h1>Змейка</h1>
            <span class="score-display" id="snakeScore">0</span>
          </div>
          <canvas id="snakeCanvas" width="320" height="400"></canvas>
          <div class="game-controls">
            <button type="button" class="game-btn" data-dir="up" aria-label="Вверх">▲</button>
            <div class="game-row">
              <button type="button" class="game-btn" data-dir="left" aria-label="Влево">◀</button>
              <button type="button" class="game-btn" data-dir="down" aria-label="Вниз">▼</button>
              <button type="button" class="game-btn" data-dir="right" aria-label="Вправо">▶</button>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>

        <!-- ACTIVE CALL OVERLAY -->
        <div class="call-overlay" id="callOverlay">
          <div class="call-wallpaper"></div>
          <div class="call-info">
            <div class="call-avatar" id="callAvatar">А</div>
            <div class="call-name" id="callName">Алексей</div>
            <div class="call-status" id="callStatus">Вызов...</div>
          </div>
          <div class="call-actions">
            <button type="button" class="call-action-btn decline" id="endCall" aria-label="Завершить звонок">
              <svg viewBox="0 0 24 24" fill="white">
                <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .55-.45 1-1 1H4.5c-.55 0-1-.45-1-1V9.72C2.05 9.25.6 9 0 9v3c0 3.5 2.83 6.5 6.5 6.5h3c3.67 0 6.5-3 6.5-6.5V9c-1.6 0-3.15.25-4.6.72v3.1c0 .55-.45 1-1 1h-1.9c-.55 0-1-.45-1-1V9.72C9.05 9.25 7.6 9 6 9z" transform="rotate(135 12 12)" />
              </svg>
            </button>
          </div>
        </div>

        <div class="home-indicator app-indicator"></div>
      </div>
    </div>

    <script>
      if (
        location.protocol === 'file:' ||
        window.navigator.standalone ||
        /android_asset/i.test(location.href)
      ) {
        document.body.classList.add('native-shell');
      }
      if (window.matchMedia('(max-width: 768px), (hover: none) and (pointer: coarse)').matches) {
        document.body.classList.add('is-mobile');
      }
    </script>
    <script src="./story-state.js"></script>
    <script src="./maps-data.js"></script>
    <script src="./maps-app.js"></script>
    <script src="./browser-data.js"></script>
    <script src="./browser-app.js"></script>
    <script src="./novogram-data.js"></script>
    <script src="./novogram-prepared.js"></script>
    <script src="./novogram-prepared-chapter2.js"></script>
    <script src="./novogram-photo-fingerprints.js"></script>
    <script src="./novogram-filler.js"></script>
    <script src="./novogram-app.js"></script>
    <script src="./phone-input.js"></script>
    <script src="./characters-data.js"></script>
    <script src="./gibdd-data.js"></script>
    <script src="./accounts.js"></script>
    <script src="./admin-store.js"></script>
    <script src="./phone-session.js"></script>
    <script src="./gibdd-app.js"></script>
    <script src="./admin-app.js"></script>
    <script src="./hints-data.js"></script>
    <script src="./hints-app.js"></script>
    <script src="./web-app.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
