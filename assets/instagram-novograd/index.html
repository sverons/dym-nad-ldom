<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новоград — Instagram-лента</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1c;
      --line: #2a2a2e;
      --text: #f2f2f2;
      --muted: #a8a8b0;
      --accent: #e8e8ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top, #1c2430 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 16px 8px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .feed {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px 48px;
      display: grid;
      gap: 18px;
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a6fa5, #1e2a3a);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #dce7f5;
    }
    .user { font-weight: 600; font-size: 0.92rem; }
    .loc { color: var(--muted); font-size: 0.78rem; }
    .photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .body { padding: 12px 14px 16px; }
    .caption {
      font-size: 0.94rem;
      white-space: pre-wrap;
      margin: 0 0 10px;
    }
    .caption strong { font-weight: 650; }
    .tags { color: #8ab4f8; font-size: 0.86rem; margin-bottom: 12px; }
    .comments {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      display: grid;
      gap: 7px;
    }
    .c {
      font-size: 0.86rem;
      color: var(--accent);
    }
    .c b { font-weight: 650; }
    .c span { color: var(--muted); }
    .num {
      display: inline-block;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
